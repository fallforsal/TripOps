name: Guide Geofence Backend CI
on:
  push:
    branches:
      - hiep
    paths:
      - 'backend/**'
      - '.github/workflows/guide-geofence-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/guide-geofence-backend.yml'
jobs:
  backend-checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore backend tests
        run: dotnet restore backend/tests/TripOps.Tests/TripOps.Tests.csproj
      - name: Execute check-in integration tests
        run: dotnet test backend/tests/TripOps.Tests/TripOps.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~Snapshot_selection_passenger_preferences_and_guide_operations_persist|FullyQualifiedName~GuideGpsDemoSeed_IsRepeatable_AndTourIsReadyToday'
