name: Guide Sequential Check-in Backend CI
on:
  push:
    branches:
      - hiep
    paths:
      - 'backend/**'
      - '.github/workflows/guide-sequential-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/guide-sequential-backend.yml'
jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/tests/TripOps.Tests/TripOps.Tests.csproj
      - name: Check-in and seed tests
        run: dotnet test backend/tests/TripOps.Tests/TripOps.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~GuideLocationCheckin_|FullyQualifiedName~GuideCheckinDemoSeed_|FullyQualifiedName~GuideCheckinImages_|FullyQualifiedName~IncidentEvidence_|FullyQualifiedName~GuideCheckinPhotos_|FullyQualifiedName~TourCompletion_|FullyQualifiedName~Agency_is_paid_automatically_two_days_after_host_agency_completes_|FullyQualifiedName~Snapshot_selection_passenger_preferences_and_guide_operations_persist'
