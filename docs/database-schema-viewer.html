    function getBadgeColor(sqlType) {

      if (sqlType.startsWith('decimal')) return 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
      if (sqlType.startsWith('nvarchar') || sqlType.startsWith('varchar')) return 'bg-amber-500/15 text-amber-300 border-amber-500/30';
      if (sqlType.startsWith('datetime') || sqlType.startsWith('time')) return 'bg-purple-500/15 text-purple-300 border-purple-500/30';
      if (sqlType.startsWith('bit')) return 'bg-pink-500/15 text-pink-300 border-pink-500/30';

          '<div class="bg-slate-800/70 px-4 py-3 border-b border-slate-700/80 flex items-center justify-between">' +
            '<div>' +
              '<span class="text-[11px] font-medium text-indigo-400 block">' + t.module + '</span>' +
              '<h3 class="font-mono text-base font-bold text-white">' + t.tableName + '</h3>' +
            '</div>' +
            '<span class="text-xs px-2.5 py-1 rounded-full bg-slate-900 text-slate-300 border border-slate-700">' + t.columns.length + ' cột</span>' +
          '</div>' +
          '<div class="overflow-x-auto">' +
            '<table class="w-full text-left border-collapse">' +
              '<thead>' +
                '<tr class="border-b border-slate-800 text-[11px] uppercase tracking-wider text-slate-400 bg-slate-950/40">' +
                  '<th class="py-2 px-3">Tên cột (Column)</th>' +
                  '<th class="py-2 px-3">Kiểu SQL Server</th>' +
                  '<th class="py-2 px-3">Kiểu C# (.NET)</th>' +
                  '<th class="py-2 px-3 text-center">Ràng buộc</th>' +
                  '<th class="py-2 px-3">Tham chiếu (FK)</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' + rowsHtml + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    searchInput.addEventListener('input', render);
    moduleFilter.addEventListener('change', render);
    render();
  </script>
</body>
</html>
